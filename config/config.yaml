experiment_name: cross_provider_trust_benchmark
seed: 42

providers:
  - name: openai
    model: gpt-4o-mini
    notes: "cheap, mid-tier cloud reference point"
  - name: anthropic
    model: claude-sonnet-5
    notes: "high-capacity cloud, second major vendor alongside OpenAI"
  - name: groq
    model: openai/gpt-oss-120b
    notes: "large open-weight model (120B), fast cloud inference via Groq LPUs"
  - name: ollama
    model: llama3.2
    notes: "3B params, genuinely edge-viable, low end of the capacity spread"

task_categories:
  - category_a_codegen
  - category_b_tool_orchestration
  - category_c_error_recovery
  - category_d_ambiguous

runs_per_task_provider: 5

logging:
  trajectory_log: true
  provenance_log: true
